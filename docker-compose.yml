name: vermilion

services:

  vermilion-postgres:
    image: postgres:16-alpine
    container_name: vermilion-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${VERMILION_PG_USER:-vermilion}
      POSTGRES_PASSWORD: ${VERMILION_PG_PASSWORD:-vermilion}
      POSTGRES_DB: ${VERMILION_PG_DB:-vermilion}
    ports:
      - "5433:5432"
    volumes:
      - vermilion_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${VERMILION_PG_USER:-vermilion} -d ${VERMILION_PG_DB:-vermilion}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: vermilion-backend
    restart: unless-stopped
    environment:
      VERMILION_ADDR: ${VERMILION_ADDR:-:8080}
      VERMILION_ENV: ${VERMILION_ENV:-dev}
      VERMILION_PG_DSN: postgres://${VERMILION_PG_USER:-vermilion}:${VERMILION_PG_PASSWORD:-vermilion}@vermilion-postgres:5432/${VERMILION_PG_DB:-vermilion}?sslmode=disable
      RUNNING_IN_CONTAINER: "true"
    ports:
      - "20030:8080"
    volumes:
      - ./backend:/app
      - /app/tmp
    depends_on:
      vermilion-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: vermilion-frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8080
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  vermilion_pgdata:
